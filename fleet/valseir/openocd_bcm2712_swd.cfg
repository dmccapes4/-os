# openocd_bcm2712_swd.cfg
# BCM2712 (Raspberry Pi 5, quad-core Cortex-A76) via DAP-Link V2 CMSIS-DAP,
# SWD through GPIO 22-27 (enable_jtag_gpio=1 required in config.txt).
#
# Physical wiring (DAP-Link V2 SWD JST → GPIO breakout on 52Pi HAT passthrough):
#   GND  → any GND
#   CLK  → GPIO 25 (ARM_TCK / SWCLK)
#   DIO  → GPIO 27 (ARM_TMS / SWDIO)
#   3.3V → Pin 1  (3V3, VTREF only — do not power the Pi from this)
#
# NOTE: GPIO 25 is also the IR receiver on the 52Pi NVDigi HAT.
#       Without the hifiberry-digi overlay, the IR circuit is electrically
#       present but idle-high. SWD should work; if debug is intermittent
#       shield the IR receiver or remove the HAT for a debug session.
#
# Select the DAP-Link V2 by serial (confirmed on valseir 2026-11-26):
#   NXP ARM mbed  0d28:0204  serial 0700000132343d79000431333937354ea5a5a5a597969908
#
# Usage:
#   openocd -f openocd_bcm2712_swd.cfg
# Then:
#   telnet localhost 4444
#   > targets           — list cores
#   > halt              — halt all cores
#   > reg               — dump registers
#   > resume            — resume execution
#
# For gdb (second terminal):
#   gdb-multiarch kyrios/_build/kyrios.elf
#   (gdb) target extended-remote localhost:3333
#   (gdb) monitor halt
#   (gdb) bt

adapter driver cmsis-dap
transport select swd

# DAP-Link V2 serial number. If this produces "no device found" check
# that valseir has 0d28:0204 in lsusb and re-read the serial with:
#   for d in /sys/bus/usb/devices/*/; do
#     vid=$(cat $d/idVendor 2>/dev/null)
#     pid=$(cat $d/idProduct 2>/dev/null)
#     [ "$vid:$pid" = "0d28:0204" ] && cat $d/serial 2>/dev/null
#   done
# Then replace the serial below.
#
# OpenOCD 0.12.0 on Kali does not expose cmsis-dap serial/vid_pid subcommands;
# the adapter selects the first CMSIS-DAP device found. If the RPi Debug Probe
# is also connected, unplug it before running this script, or run:
#   openocd -f openocd_bcm2712_swd.cfg -c "cmsis-dap serial 0700000132343d79000431333937354ea5a5a5a597969908"

# Start slow; BCM2712 DAP is robust but GPIO path adds RC. Increase after
# a confirmed connection.
adapter speed 500

# BCM2712 ADIv5 SWD — expected DAP ID for Cortex-A76 ARM Limited:
# 0x6ba02477 (observed on some Pi 5 units). Set -ignore-version if the
# minor version differs on this board.
swd newdap bcm2712 dap -enable -expected-id 0x6ba02477 -ignore-version

dap create bcm2712.dap -chain-position bcm2712.dap

# MEM-AP 0 gives direct system bus access.
target create bcm2712.ap mem_ap -dap bcm2712.dap -ap-num 0

# Four Cortex-A76 cores.
# Debug base addresses from ARM CoreSight ROM table — read back with
# "dap info 0" once a live connection is established. These are the
# values documented for BCM2712; adjust if dap info reports different ones.
set _DBGBASE {0x80010000 0x80110000 0x80210000 0x80310000}
set _CTIBASE {0x80020000 0x80120000 0x80220000 0x80320000}

set _smp_command "target smp"

for { set _core 0 } { $_core < 4 } { incr _core } {
    cti create bcm2712.cti${_core} \
        -dap bcm2712.dap -ap-num 0 \
        -baseaddr [lindex $_CTIBASE $_core]

    target create bcm2712.cpu${_core} aarch64 \
        -dap bcm2712.dap -ap-num 0 \
        -dbgbase [lindex $_DBGBASE $_core] \
        -cti bcm2712.cti${_core}

    set _smp_command "$_smp_command bcm2712.cpu${_core}"
}

eval $_smp_command
targets bcm2712.cpu0

# GDB server on port 3333, telnet on 4444 (OpenOCD defaults).
# No reset on connect — κύριος is already running and we want to attach live.
init
echo "BCM2712 SWD: init done. Use 'halt' to stop cores, 'resume' to continue."
